apiVersion: v1
kind: Pod
metadata:
  name: worker-network-test
  namespace: aspecta-app
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  nodeSelector:
    kubernetes.io/hostname: aspecta-m02
  containers:
    - name: network-test
      image: busybox:1.36
      command: ["/bin/sh", "-c"]
      args:
        - |
          set -e
          echo "Testing Kubernetes DNS..."
          nslookup aspecta-backend.aspecta-app.svc.cluster.local

          echo "Testing cross-node HTTP..."
          wget -T 10 -qO- http://aspecta-backend.aspecta-app.svc.cluster.local:3000/healthz
          echo
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          cpu: 100m
          memory: 64Mi
