# Aspecta - resource-aware Argo CD installation

dex:
  enabled: false

applicationSet:
  replcas: 0

notifications:
  enabled: false

redis-ha:
  enabled: false

controller:
  replicas: 1
  resources:
    requests:
      cpu: 75m
      memory: 192Mi
    limits:
      cpu: 500m
      memory: 512Mi

repoServer:
  replicas: 1
  resources:
    requests:
      cpu: 75m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

server:
  replicas: 1
  service:
    type: ClusterIP
  ingress:
    enabled: false
  resources:
    requests:
      cpu: 50m
      memory: 96Mi
    limits:
      cpu: 300m
      memory: 256Mi

redis:
  enabled: true
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 150m
      memory: 128Mi
