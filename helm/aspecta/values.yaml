config:
  appEnv: dev
  appMessage: "Hello from Aspecta Kubernetes!"

# NodeSelector limits the app to workers, soft preferences allow failover.
scheduling:
  nodeSelector:
    aspecta.io/pool: workers
  preferredNodeTier: apps

backend:
  replicaCount: 1
  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 2
    targetCPUUtilizationPercentage: 70
  image:
    repository: ghcr.io/jansoltys9/aspecta-backend
    tag: sha-f61e8074e2553dd9ff3e3503a9797718d2ff0feb
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi
  auth:
    existingSecretName: aspecta-backend-auth-gitops

frontend:
  replicaCount: 1
  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 2
    targetCPUUtilizationPercentage: 70
  image:
    repository: ghcr.io/jansoltys9/aspecta-frontend
    tag: sha-f61e8074e2553dd9ff3e3503a9797718d2ff0feb
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 128Mi

ingress:
  enabled: true
  className: traefik
  ignoreArgoHealth: true

rbac:
  auditor:
    enabled: true

networkPolicy:
  enabled: true

# Disable when running the standalone reviewer demo without Prometheus Operator CRDs.
observability:
  enabled: true
