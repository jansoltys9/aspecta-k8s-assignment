apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ .Release.Name }}-backend
  labels:
    release: aspecta-monitoring
spec:
  groups:
    - name: aspecta.backend.availability
      rules:
        - alert: AspectaBackendScrapeDown
          expr: 'up{namespace="{{ .Release.Namespace }}",service="{{ .Release.Name }}-backend"} == 0'
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "Aspecta backend metrics scrape failed"
            description: "Prometheus cannot scrape the backend Service for at least one minute."
        - alert: AspectaBackendTargetMissing
          expr: 'absent(up{namespace="{{ .Release.Namespace }}",service="{{ .Release.Name }}-backend"})'
          for: 1m
          labels:
            severity: warning
          annotations:
            summary: "Aspecta backend Prometheus target missing"
            description: "No backend scrape target has been discovered for at least one minute."
