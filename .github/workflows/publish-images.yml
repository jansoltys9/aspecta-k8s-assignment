name: Aspecta - CI, Security, GHCR and GitOps

on:
  pull_request:
    branches: [main, feat/platform-security-gitops]
    paths:
      - "app/**"
      - "helm/**"
      - ".github/workflows/publish-images.yml"
      - "scripts/promote-images.py"
  push:
    branches: [main, feat/platform-security-gitops]
    paths:
      - "app/**"
      - "helm/**"
      - ".github/workflows/publish-images.yml"
      - "scripts/promote-images.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aspecta-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate application and Helm
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json

      - name: Validate backend syntax
        run: node --check app/backend/server.js

      - name: Build frontend
        working-directory: app/frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.21.2

      - name: Lint, render and package chart
        run: |
          helm lint ./helm/aspecta
          helm template aspecta ./helm/aspecta \
            --namespace aspecta-app > /tmp/aspecta.yaml
          helm package ./helm/aspecta --destination /tmp

  scan:
    name: Trivy HIGH/CRITICAL - ${{ matrix.component }}
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: backend
            context: ./app/backend
          - component: frontend
            context: ./app/frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image for scan
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          load: true
          push: false
          tags: aspecta-${{ matrix.component }}:ci

      - name: Block on fixable HIGH or CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: aspecta-${{ matrix.component }}:ci
          format: table
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

  publish:
    name: Publish GHCR - ${{ matrix.component }}
    if: github.event_name != 'pull_request'
    needs: [validate, scan]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: backend
            context: ./app/backend
          - component: frontend
            context: ./app/frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish immutable SHA image + SBOM/provenance
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          push: true
          platforms: linux/amd64
          sbom: true
          provenance: mode=min
          tags: ghcr.io/${{ github.repository_owner }}/aspecta-${{ matrix.component }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

  promote-gitops:
    name: Promote images to GitOps (pilot branch)
    if: github.event_name == 'push' && github.ref == 'refs/heads/feat/platform-security-gitops'
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout deployment branch
        uses: actions/checkout@v4
        with:
          ref: feat/platform-security-gitops
          persist-credentials: true

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.21.2

      - name: Set both image repositories and SHA tags
        env:
          IMAGE_OWNER: ${{ github.repository_owner }}
          IMAGE_SHA: ${{ github.sha }}
        run: |
          python3 scripts/promote-images.py \
            --owner "$IMAGE_OWNER" --sha "$IMAGE_SHA"
          helm template aspecta ./helm/aspecta \
            --namespace aspecta-app > /tmp/aspecta.yaml

      - name: Commit desired image versions
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add helm/aspecta/values.yaml
          if ! git diff --cached --quiet; then
            git commit -m "chore(gitops): promote images for $GITHUB_SHA [skip ci]"
            git push origin HEAD:feat/platform-security-gitops
          fi
