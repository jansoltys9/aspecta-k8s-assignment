name: Aspecta - Build and Publish Images

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/publish-images.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate application and Helm
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json

      - name: Validate backend syntax
        run: node --check app/backend/server.js

      - name: Build frontend
        working-directory: app/frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.21.2

      - name: Validate and package Helm chart
        run: |
          helm lint ./helm/aspecta
          helm template aspecta ./helm/aspecta \
            --namespace aspecta-app > /tmp/aspecta.yaml
          helm package ./helm/aspecta \
            --destination /tmp

  publish:
    name: Publish ${{ matrix.component }}
    needs: validate
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - component: backend
            context: ./app/backend
          - component: frontend
            context: ./app/frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      
      - name: Build image for security scan
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          load: true
          push: false
          tags: aspecta-${{ matrix.component }}:ci

      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: aspecta-${{ matrix.component }}:ci
          format: table
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          push: true
          platforms: linux/amd64
          sbom: true
          provenance: mode=min
          tags: ghcr.io/${{ github.repository_owner }}/aspecta-${{ matrix.component }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
