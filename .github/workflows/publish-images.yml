name: Aspecta - CI, Security, GHCR and GitOps

on:
  pull_request:
    branches: [main]
    paths:
      - "app/**"
      - "helm/**"
      - ".github/workflows/publish-images.yml"
      - ".github/scripts/promote-images.py"
  push:
    branches: [main]
    tags:
      - "backend-v*"
      - "frontend-v*"
    paths:
      - "app/**"
      - "helm/**"
      - ".github/workflows/publish-images.yml"
      - ".github/scripts/promote-images.py"
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: ${{ startsWith(github.ref, 'refs/tags/') && 'aspecta-releases' || format('aspecta-ci-{0}', github.ref) }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  changes:
    name: Detect application changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      app: ${{ steps.filter.outputs.app }}
      ci: ${{ steps.filter.outputs.ci }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name != 'workflow_dispatch' && !startsWith(github.ref, 'refs/tags/')
        with:
          base: ${{ github.ref }}
          filters: |
            app:
              - 'app/**'
            ci:
              - '.github/workflows/publish-images.yml'
              - '.github/scripts/promote-images.py'

  validate:
    name: Validate application and Helm
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json
      - name: Validate backend syntax
        run: node --check app/backend/server.js
      - name: Build frontend
        working-directory: app/frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.21.2
      - name: Lint, render and package chart
        run: |
          helm lint ./helm/aspecta
          helm template aspecta ./helm/aspecta \
            --namespace aspecta-app > /tmp/aspecta.yaml
          helm package ./helm/aspecta --destination /tmp

  release-meta:
    name: Validate component release tag
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    outputs:
      component: ${{ steps.tag.outputs.component }}
      image_tag: ${{ steps.tag.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Parse SemVer and verify released code is on main
        id: tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^(backend|frontend)-v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Invalid release tag: $RELEASE_TAG (expected backend-vX.Y.Z or frontend-vX.Y.Z)" >&2
            exit 1
          fi
          component="${BASH_REMATCH[1]}"
          image_tag="${RELEASE_TAG#${component}-}"
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Release commit must already be merged into main" >&2
            exit 1
          fi
          echo "component=$component" >> "$GITHUB_OUTPUT"
          echo "image_tag=$image_tag" >> "$GITHUB_OUTPUT"

  scan:
    name: Trivy HIGH/CRITICAL - ${{ matrix.component }}
    needs: [validate, changes]
    if: >-
      startsWith(github.ref, 'refs/tags/') ||
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.app == 'true' ||
      needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: backend
            context: ./app/backend
          - component: frontend
            context: ./app/frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build image for scan
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          load: true
          push: false
          tags: aspecta-${{ matrix.component }}:ci
      - name: Block on fixable HIGH or CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: aspecta-${{ matrix.component }}:ci
          format: table
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

  publish:
    name: Publish release to GHCR
    if: startsWith(github.ref, 'refs/tags/')
    needs: [validate, scan, release-meta]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout tagged application source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish component SemVer image + SHA identity
        uses: docker/build-push-action@v7
        with:
          context: ./app/${{ needs.release-meta.outputs.component }}
          push: true
          platforms: linux/amd64
          sbom: true
          provenance: mode=min
          tags: |
            ghcr.io/${{ github.repository_owner }}/aspecta-${{ needs.release-meta.outputs.component }}:${{ needs.release-meta.outputs.image_tag }}
            ghcr.io/${{ github.repository_owner }}/aspecta-${{ needs.release-meta.outputs.component }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.release-meta.outputs.image_tag }}

  promote-gitops:
    name: Promote released component to GitOps
    if: startsWith(github.ref, 'refs/tags/')
    needs: [publish, release-meta]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout current GitOps main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.21.2
      - name: Set released component image tag
        env:
          IMAGE_OWNER: ${{ github.repository_owner }}
          RELEASE_COMPONENT: ${{ needs.release-meta.outputs.component }}
          RELEASE_IMAGE_TAG: ${{ needs.release-meta.outputs.image_tag }}
        run: |
          python3 .github/scripts/promote-images.py \
            --owner "$IMAGE_OWNER" \
            --component "$RELEASE_COMPONENT" \
            --tag "$RELEASE_IMAGE_TAG"
          helm template aspecta ./helm/aspecta \
            --namespace aspecta-app > /tmp/aspecta.yaml
      - name: Commit image selection to GitOps
        env:
          RELEASE_COMPONENT: ${{ needs.release-meta.outputs.component }}
          RELEASE_IMAGE_TAG: ${{ needs.release-meta.outputs.image_tag }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add helm/aspecta/values.yaml
          if ! git diff --cached --quiet; then
            git commit -m "chore(gitops): deploy $RELEASE_COMPONENT $RELEASE_IMAGE_TAG [skip ci]"
            git push origin HEAD:main
          fi
