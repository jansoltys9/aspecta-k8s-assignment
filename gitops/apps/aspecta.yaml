apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: aspecta
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/jansoltys9/aspecta-k8s-assignment.git
    targetRevision: feat/platform-security-gitops
    path: helm/aspecta
    helm:
      releaseName: aspecta

  destination:
    server: https://kubernetes.default.svc
    namespace: aspecta-app
