apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: aspecta-management
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-30"
spec:
  description: Aspecta App-of-Apps management

  sourceRepos:
    - https://github.com/jansoltys9/aspecta-k8s-assignment.git

  destinations:
    - server: https://kubernetes.default.svc
      namespace: argocd

  namespaceResourceWhitelist:
    - group: argoproj.io
      kind: Application
    - group: argoproj.io
      kind: AppProject
